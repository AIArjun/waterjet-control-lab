[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "waterjet-control-lab"
version = "0.1.0"
description = "Educational marine control simulator, Qt HMI and fault-verification bench"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.8,<7"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
waterjet-lab = "waterjet_lab.api:main"
waterjet-qt = "waterjet_lab.desktop:main"
waterjet-verify = "waterjet_lab.verification:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waterjet_lab = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
