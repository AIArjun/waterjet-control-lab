services:
  - type: web
    name: waterjet-control-lab
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements-web.txt && pip install --no-deps .
    startCommand: waterjet-lab
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.16
      - key: HOST
        value: 0.0.0.0
